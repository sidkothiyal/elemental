# ──────────────────────────────────────────────────────────────────────────────
# Vast.ai Instance Configuration — RTX 4090 (dummy/example)
# ──────────────────────────────────────────────────────────────────────────────
# This file is sourced by deploy/vastai/create_instance.sh and ensure_machine
# to configure instance creation. Uncomment and modify as needed.
#
# Reference: https://docs.vast.ai/api-reference/instances/create-instance
#            https://docs.vast.ai/api-reference/search/search-offers
# ──────────────────────────────────────────────────────────────────────────────

# Instance label (shown in vast.ai console)
INSTANCE_LABEL="elemental-training"

# Docker image
IMAGE="vastai/base-image:latest"

# Local disk size in GB
DISK_GB=50

# Run type: ssh, jupyter, args, etc.
RUNTYPE="ssh"

# target_state: running or stopped
TARGET_STATE="running"

# ── Offer search (used when OFFER_ID is not set) ─────────────────────────────
# GPU filter: exact match or use search to find first available
GPU_NAME="RTX_4090"
NUM_GPUS=1
# Offer type: ondemand, bid, or reserved
OFFER_TYPE="ondemand"
# Max offers to return when searching
OFFER_LIMIT=20
# Optional filters
# RELIABILITY_MIN=0.99
# DPH_MAX=1.0

# For bid (interruptible) instances, set OFFER_TYPE=bid and optional PRICE:
# OFFER_TYPE="bid"
# PRICE=0.5

# Optional: use a specific offer ID (skip search). Get from vast.ai console or search.
# OFFER_ID=12345678

# Recovery policy for run.sh pulse/auto-restart (same as RunPod)
#   "new"     — create a fresh instance on failure (recommended for bid)
#   "restart" — try to start the existing stopped instance
RECOVERY_POLICY="new"

# Optional: onstart script run when instance starts
# ONSTART="echo ready > /tmp/ready"
# Optional: env in Docker format (e.g. -e KEY=val -p 8888:8888)
# ENV=""
