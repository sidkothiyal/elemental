# ──────────────────────────────────────────────────────────────────────────────
# Vast.ai Instance Configuration — A100 SXM4 (interruptible / bid)
# ──────────────────────────────────────────────────────────────────────────────
# This file is sourced by deploy/vastai/create_instance.sh and ensure_machine
# to configure instance creation. Uncomment and modify as needed.
#
# Reference: https://docs.vast.ai/api-reference/instances/create-instance
#            https://docs.vast.ai/api-reference/search/search-offers
# ──────────────────────────────────────────────────────────────────────────────

# Instance label (shown in vast.ai console)
INSTANCE_LABEL="elemental-training"

# Docker image (use GHRC_IMAGE when set by run.sh for ghcr.io registry flow)
IMAGE="${GHRC_IMAGE:-vastai/base-image:@vastai-automatic-tag}"

# Local disk size in GB
DISK_GB=50

# Run type: ssh, jupyter, args, etc.
RUNTYPE="ssh"

# target_state: running or stopped
TARGET_STATE="running"

# ── Offer search (used when OFFER_ID is not set) ─────────────────────────────
# GPU filter: exact match or use search to find first available
GPU_NAME="A100 SXM4"
NUM_GPUS=1
# Target a specific host machine (UI shows as "m:49289"; API uses numeric id)
MACHINE_ID=49290
# Offer type: ondemand, bid, or reserved
OFFER_TYPE="bid"
# Max offers to return when searching (integer)
OFFER_LIMIT=10
# Optional filters
# RELIABILITY_MIN=0.99
# DPH_MAX=1.0

# ── Bid (interruptible) pricing ──────────────────────────────────────────────
# Start at 0.146/hr; if create fails (e.g. bid too low), linearly increment
# up to PRICE_MAX. Step between attempts: PRICE_STEP.
PRICE=0.155
PRICE_MAX=0.200
PRICE_STEP=0.005
# Leave OFFER_ID unset to search by GPU + MACHINE_ID; set to lock to one offer.
# OFFER_ID=

# Recovery policy for run.sh pulse/auto-restart (same as RunPod)
#   "new"     — create a fresh instance on failure (recommended for bid)
#   "restart" — try to start the existing stopped instance
RECOVERY_POLICY="new"

# Optional: onstart script run when instance starts.
# Fix SSH authorized_keys permissions (sshd requires 700 on .ssh, 600 on authorized_keys).
# Retry for ~15s so we fix permissions even if vast.ai injects the key after container start.
ONSTART="chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && chown root:root /root/.ssh /root/.ssh/authorized_keys"
# Optional: env in Docker format (e.g. -e KEY=val -p 8888:8888)
# ENV=""
