# ──────────────────────────────────────────────────────────────────────────────
# RunPod Pod Configuration — NVIDIA L40S
# ──────────────────────────────────────────────────────────────────────────────
# Same as pod_a40.conf but uses L40S GPUs. Used as fallback when A40 is unavailable.
# Reference: https://docs.runpod.io/references/gpu-types
# ──────────────────────────────────────────────────────────────────────────────

# Pod name (required)
POD_NAME="elemental-training-l40s"

# GPU configuration — NVIDIA L40S (48GB, Ada Lovelace)
GPU_TYPE="NVIDIA L40S"
GPU_COUNT=1

# Cloud tier: "secure" or "community"
CLOUD_TIER="secure"

# Spot instance (interruptible)
SPOT=true

# Recovery policy
RECOVERY_POLICY="new"

# Container image (use GHRC_IMAGE when set by run.sh for ghcr.io registry flow)
IMAGE_NAME="${GHRC_IMAGE:-runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404}"

# Template ID (optional)
# TEMPLATE_ID="runpod-torch-v280"

# Storage (in GB)
CONTAINER_DISK_SIZE=30
VOLUME_SIZE=50
VOLUME_PATH="/workspace"

# Attach an existing network volume (optional)
NETWORK_VOLUME_ID="gdfzdf07b5"

# System resources
MIN_MEMORY_GB=20
MIN_VCPU=1

# Ports to expose
PORTS="22/tcp"

# SSH public key files
SSH_PUBLIC_KEY_FILES="~/.ssh/id_ed25519.pub ~/.ssh/id_ed25519_sid.pub"

# Environment variables
ENV_VARS=""
