# ──────────────────────────────────────────────────────────────────────────────
# RunPod Pod Configuration
# ──────────────────────────────────────────────────────────────────────────────
# This file is sourced by deploy/runpod/create_pod.sh to configure pod creation.
# Uncomment and modify values as needed. Lines starting with # are ignored.
#
# Reference: https://docs.runpod.io/runpodctl/reference/runpodctl-create-pod
# ──────────────────────────────────────────────────────────────────────────────

# Pod name (required)
POD_NAME="elemental-training"

# GPU configuration https://docs.runpod.io/references/gpu-types
GPU_TYPE="NVIDIA A40"
GPU_COUNT=1

# Cloud tier: "secure" or "community"
CLOUD_TIER="secure"

# Container image
IMAGE_NAME="runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"

# Template ID (optional, overrides image if set)
TEMPLATE_ID="runpod-torch-v280"

# Storage (in GB)
CONTAINER_DISK_SIZE=30
VOLUME_SIZE=50
VOLUME_PATH="/workspace"

# Attach an existing network volume (optional)
NETWORK_VOLUME_ID="ghkc70e22v"

# System resources
MIN_MEMORY_GB=20
MIN_VCPU=1

# Cost ceiling (dollars/hour, optional — omit for lowest available)
# MAX_COST=""

# Ports to expose (space-separated, e.g. "8888/http 22/tcp")
PORTS="22/tcp"

# Environment variables (semicolon-separated KEY=VALUE pairs)
# Values may contain spaces.  Example with multiple vars:
#   ENV_VARS="KEY1=value1; KEY2=some long value; KEY3=another"
ENV_VARS="PUBLIC_KEY={{ RUNPOD_SECRET_aurora_lisa }}\n{{ RUNPOD_SECRET_Aurora }}\n{{ RUNPOD_SECRET_silly-book }}"

# Additional container arguments (optional)
# CONTAINER_ARGS=""
