[project]
name = "gan"
version = "0.0.1"
authors = [
  { name = "Lisa Malani", email = "monalisamalani@hotmail.com" },
  { name = "Siddharth Kothiyal", email = "sid.kothiyal27@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
  "numpy (>=2.0.0, <3)",
  "torchvision (>=0.21.0, <0.22.0)",
  "torch (>=2.5.1, <3)",
  "tqdm (>=4.67.0, <5)",
  "onnx (>=1.17.0, <2)",
  "onnxscript (>=0.2, <0.3)",
  "onnxruntime (>=1.20.0, <2)",
  "pyyaml (>=6.0.2, <7.0.0)",
  "wandb (>=0.19.7, <0.20.0)",
  "osmnx (>=2.0.1, <3.0.0)",
  "matplotlib (>=3.10.0, <4.0.0)",
  "black (>=25.1.0, <26.0.0)",
  "scikit-learn (>=1.6.1, <2.0.0)",
  "torchmetrics (>=1.6.2, <2.0.0)",
]

[dependency-groups]
dev = [
  "ipykernel (>=6.25.1, <7)",
]

[project.optional-dependencies]
dev = [
  "pylint ~=2.14.0",
  "toml ~=0.10.2",
  "yapf ~=0.32.0",
]
test = [
  "pytest-cov ~=3.0.0",
]

[tool.isort]
profile = "black"

[tool.yapf]
blank_line_before_nested_class_or_def = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html --cov-report term-missing --cov-fail-under 95"

[tool.coverage.run]
source = ["src"]