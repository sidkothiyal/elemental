[project]
name = "elemental"
version = "0.0.1"
authors = [
  { name = "Lisa Malani", email = "monalisamalani@hotmail.com" },
  { name = "Siddharth Kothiyal", email = "sid.kothiyal27@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
  "black (>=25.1.0, <26.0.0)",
  "hydra-core",
  "einops",
  "fire (>=0.6.0, <1.0.0)",
  "matplotlib (>=3.10.0, <4.0.0)", # Unused
  "numpy (>=2.0.0, <3)",
  "onnx (>=1.17.0, <2)", # Unused
  "onnxruntime (>=1.20.0, <2)", # Unused
  "onnxscript (>=0.2, <0.3)", # Unused
  "osmnx (>=2.0.1, <3.0.0)", # Unused
  "pre-commit",
  "pyyaml (>=6.0.2, <7.0.0)", # Unused
  "pytest",
  "scikit-learn (>=1.6.1, <2.0.0)", # Unused
  "torch",
  "torchmetrics (>=1.0.0, <2.0.0)",
  "torchvision", # Unused
  "tqdm (>=4.66.5, <5)", # Unused
  "wandb (>=0.19.7, <0.20.0)", # Unused
]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "ipykernel (>=6.25.1, <7)",
]

[project.optional-dependencies]
dev = [
  "pylint ~=2.14.0",
  "toml ~=0.10.2",
  "yapf ~=0.32.0",
]
test = [
  "pytest-cov ~=3.0.0",
]

[tool.isort]
profile = "black"
combine_as_imports = true
force_single_line = false
line_length = 100

[tool.pylint.MASTER]
extension-pkg-allow-list = [
    "numpy",
    "torch",
    "torchvision",
    "wandb",
    "onnx",
    "onnxruntime",
    "sklearn",
]

[tool.pylint.MESSAGES_CONTROL]
disable = [
    "import-error",
    "c-extension-no-member",
]

[tool.yapf]
blank_line_before_nested_class_or_def = true

#[tool.pytest.ini_options]
#addopts = "--cov --cov-report html --cov-report term-missing --cov-fail-under 95"

[tool.coverage.run]
source = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch", marker = "sys_platform == 'darwin'"},
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'"},
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'"},
]
torchvision = [
  { index = "pytorch", marker = "sys_platform == 'darwin'"},
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'"},
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'"},
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
