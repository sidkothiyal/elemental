# @package _global_
# Autoregressive Language Model on WikiText
#
# Usage: python src/trainer.py experiment/autoregressive/wikitext_lm

defaults:
  - /default
  - /dataset: wikitext
  - /model: autoregressive_lm
  - /loss: shifted_teacher_forcing
  - /optimizer: adam
  - /scheduler: step_lr
  - /callback: default
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: autoregressive_lm_wikitext_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoregressive_lm/

mode: "autoregressive"

# Training overrides
lr: 0.00025
num_epochs: 10000
batch_size: 6
gradient_accumulation_steps: 2
validation_interval: 1000

# Scheduler params override
lr_scheduler_params:
  step_size: 500
  gamma: 0.9

# Decode token tensors to text in W&B (HuggingFace "gpt2" tokenizer).
to_log:
  input/input: text
  target: text
  pred: text
  post_processed/generated: text

# Override callbacks for language modeling
callbacks:
  wandb:
    logging_interval: 100
    tokenizer: ${pretrained_tokenizer}
    tokenizer_type: hf
  checkpoint:
    save_every_n_epochs: 100

# Post-processors: generate text samples for logging
postprocessors:
  _target_: postprocessor.pipeline.PostProcessorPipeline
  steps:
    generate:
      _target_: postprocessor.pipeline.PostProcessorStep
      processor:
        _target_: postprocessor.generate.GeneratePostProcessor
        max_new_tokens: 100
      input_mapping:
        "model": "model"
        "input/input": "input_data"
      output_key: "post_processed/generated"
