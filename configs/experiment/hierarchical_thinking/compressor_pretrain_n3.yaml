# @package _global_
# Stage-1: pretrain the N=3 ("word"-scale) sliding Perceiver compressor as a
# token MAE on FineWeb-EDU. Output goes to
# ``results/hierarchical_thinking/compressor_pretrain_n3/checkpoints/``. The trained
# compressor + token embedding weights are merged into the joint
# MultiScaleLM via checkpoint surgery before launching v0_pretrain.yaml.
#
# Usage:
#   uv run python src/trainer.py experiment/hierarchical_thinking/compressor_pretrain_n3
#
# Smoke run:
#   uv run python src/trainer.py experiment/hierarchical_thinking/compressor_pretrain_n3 \
#       num_epochs=1 dataset.dataloader.train.dataset.max_docs=2000

defaults:
  - /default
  - /dataset: fineweb_edu
  - /model: hierarchical_thinking/compressor_mae_n3
  - /loss: hierarchical_thinking_compressor_mae
  - /optimizer: adamw
  - /scheduler: nanochat_warmup_cosine
  - /callback: default
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: hierarchical_thinking_compressor_pretrain_n3_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/hierarchical_thinking/

mode: "autoregressive"           # falls through to the default Trainer
dtype: bfloat16
channels_last: false
cudnn_benchmark: false

batch_size: 4
gradient_accumulation_steps: 8
num_epochs: 1
validation_interval: 0
clip_grad_norm: 1.0

warmup_steps: 500
total_steps: 30000

# Match the dataset seq_len with the model max_length.
seq_len: 2048

# Decode token tensors to text in W&B (tokenizer_path comes from the dataset).
to_log:
  input/input: text
  target: text
  pred: text

callbacks:
  wandb:
    logging_interval: 50
    tokenizer: ${tokenizer_path}
    tokenizer_type: bpe
  checkpoint:
    save_every_n_epochs: 1
