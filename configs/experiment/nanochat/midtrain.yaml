# @package _global_
# Nanochat midtraining: a continuation of pretraining on a (typically smaller,
# higher-quality) corpus, resuming from a pretrain checkpoint with a lower lr.
#
# Usage:
#   uv run python src/trainer.py experiment/nanochat/midtrain \
#       load_checkpoint_path=results/nanochat/<pretrain-run>/last.pt
#
# This config inherits the pretrain dataset by default. To use a different
# midtraining mix, override `dataset` on the CLI or in your override file.

defaults:
  - /default
  - /dataset: fineweb_edu
  - /model: nanochat_gpt_d20
  - /loss: lm_pretrain
  - /optimizer: muon_adamw
  - /scheduler: nanochat_warmup_cosine
  # LM eval metrics BEFORE /callback: default (ordering — see lm_eval_metrics.yaml).
  - /callback/lm_eval_metrics@callbacks.metrics
  - /callback: default
  - /postprocessor/lm_generate
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: nanochat_midtrain_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/nanochat/

mode: "autoregressive"
dtype: bfloat16
channels_last: false
cudnn_benchmark: false

batch_size: 32
gradient_accumulation_steps: 4
num_epochs: 1
validation_interval: 0
# Step-based held-out eval (shorter horizon than pretrain).
validation_interval_steps: 2000
validation_max_batches: 50
clip_grad_norm: 1.0
skip_nonfinite_steps: true

# Smaller LRs and shorter horizon than pretraining.
warmup_steps: 100
total_steps: 10000
min_lr_ratio: 0.0  # decay to 0 (override the shared scheduler's 0.1 floor)

tokenizer_path: artifacts/tokenizer/nanochat_bpe.json

# Decode token tensors to text in W&B (input/target context + argmax of pred,
# plus the validation generation sample).
to_log:
  input/input: text
  target: text
  pred: text
  post_processed/generated: text

optimizer_groups:
  muon:
    _target_: optimizer.muon.Muon
    lr: 0.005
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 0.0
  adamw:
    _target_: torch.optim.AdamW
    lr: 0.0002
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.0
lr: 0.005

# Resume weights from pretrain. Override on the CLI.
load_checkpoint_path: null
strict: true
resume_training: false

callbacks:
  wandb:
    logging_interval: 25
    tokenizer: ${tokenizer_path}
    tokenizer_type: bpe
  checkpoint:
    save_every_n_epochs: 1
    # Counts OPTIMIZER steps (grad-accum-invariant); 1k over a 10k-step run gives
    # ~10 resume points.
    save_every_n_steps: 1000
