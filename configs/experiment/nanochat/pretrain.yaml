# @package _global_
# Nanochat base pretraining on FineWeb-EDU.
#
# Usage:
#   uv run python src/trainer.py experiment/nanochat/pretrain
#
# Prereq: train the BPE tokenizer first via
#   uv run python src/tools/train_tokenizer.py tokenizer=nanochat_bpe

defaults:
  - /default
  - /dataset: fineweb_edu
  - /model: nanochat_gpt_d12
  - /loss: lm_pretrain
  - /optimizer: muon_adamw
  - /scheduler: nanochat_warmup_cosine
  # LM eval metrics (next-token acc + bpb) BEFORE /callback: default so this
  # callback precedes WandbCallback in the broadcast and its metrics get logged.
  - /callback/lm_eval_metrics@callbacks.metrics
  - /callback: default
  # Free-running generation samples during validation (phases: [val]).
  - /postprocessor/lm_generate
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: nanochat_pretrain_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/nanochat/

mode: "autoregressive"
dtype: bfloat16
channels_last: false
cudnn_benchmark: false  # token shape is constant; benchmark not useful

# torch.compile — tuned for this clean dense GPT on a long (7500-step) 8×H100 run.
#   mode=max-autotune-no-cudagraphs: autotuned Triton matmuls (compile cost amortizes
#     over thousands of steps) WITHOUT CUDA graphs, which conflict with DDP allreduce
#     hooks + gradient accumulation. reduce-overhead/cudagraphs would be fragile here.
#   fullgraph=true: NanochatGPT's training forward is a clean unrolled block loop with
#     no data-dependent control flow (the .all() early-stop is inference-only), so it
#     traces to a single graph — catch any regression that introduces a break.
#   dynamic=false: token shape is constant (batch × max_length), so specialise on it.
torch_compile:
  enabled: true
  mode: max-autotune-no-cudagraphs
  fullgraph: true
  dynamic: false

# Pretraining knobs (override on the command line for smoke runs).
# Sized for an 8×H100 run: per-GPU batch_size × grad_accum × 8 GPUs = global batch
# 256 (= 0.524M tokens/optimizer-step). batch_size 32 fits an 80GB card for this
# 185M model; if it OOMs, halve to 16 and set gradient_accumulation_steps=2 (keep
# the product batch_size×grad_accum = 32 per GPU so the global batch stays 256 and
# stays matched to the recursive_memory / memory_bank arms).
batch_size: 16
gradient_accumulation_steps: 2
num_epochs: 1
validation_interval: 0  # epoch-based eval off; use step-based eval below instead
# Held-out eval every 1k optimizer steps (≈524M tokens apart at global batch 256),
# capped at 50 batches so each eval stays cheap. Reports val/loss_total,
# val/perplexity, val/next_token_acc, val/bits_per_byte + a generation sample.
# (10k would never fire in this ~7.5k-step compute-optimal run.)
validation_interval_steps: 1000
validation_max_batches: 50
clip_grad_norm: 1.0
# Resilience: drop a non-finite accumulation window instead of crashing.
skip_nonfinite_steps: true

# Scheduler horizon (used by warmup-cosine). Compute-optimal (~Chinchilla 20×) for
# this ~186M model: 7500 optimizer steps × 0.524M tokens ≈ 3.9B tokens (~21×/param).
# warmup is 10% of the horizon. Multiply both for a longer (over-trained) run.
warmup_steps: 750
total_steps: 7500

min_lr_ratio: 0.001

# Drive run length by optimizer steps, not dataset exhaustion: a streaming
# IterableDataset has no well-defined epoch, so num_epochs=1 alone would stop
# whenever the stream runs dry. Capping at total_steps ends the run exactly
# when the cosine schedule reaches min_lr.
max_steps: ${total_steps}

# Hand the tokenizer artifact through to dataset + model overrides.
tokenizer_path: artifacts/tokenizer/nanochat_bpe.json

# Decode token tensors to text in W&B (input/target context + argmax of pred,
# plus the free-running generation sample produced during validation).
to_log:
  input/input: text
  target: text
  pred: text
  post_processed/generated: text

callbacks:
  wandb:
    logging_interval: 1000
    tokenizer: ${tokenizer_path}
    tokenizer_type: bpe
  checkpoint:
    save_every_n_epochs: 1
    # Step-level checkpoints for the single-epoch streaming run, so resume restores
    # the LR schedule + stream position (see Trainer resume logic). Counts OPTIMIZER
    # steps; 1k (not 2k) so a ~7.5k-step run still produces several resume points.
    save_every_n_steps: 1000
