# @package _global_
# Transformer-based Conditional Diffusion model for image compression
# Uses Patcher/Unpatcher with Transformer encoder/decoder
#
# Usage: python src/trainer.py experiment/autoencoder/compression_transformer_conditional_diffusion

defaults:
  - /default
  - /loss: l1
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - _self_

experiment_name: compression_autoencoder_conditional_attn_diffusion_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

# load_checkpoint_path: results/autoencoder/compression_autoencoder_conditional_attn_diffusion_2026-01-28_00-44-50/last.pt
# resume_training: true
# strict: false

mode: "autoencoder"

# Custom dataset with 960 width for transformer patches
target_shape: [640, 960]

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.div2k_dataset.DIV2KDataset
        root_dir: data/div2k/train
        target_shape: ${target_shape}
      noise_schedule: "cosine"  # Better SNR distribution than linear
      timestep_bias: "loss_aware"  # Sample timesteps proportional to per-timestep loss
      timestep_loss:
        _target_: torch.nn.L1Loss
        reduction: "none"
      loss_ema_decay: 0.99  # EMA smoothing for loss history
      loss_aware_warmup: 500  # Uniform sampling for first N update calls
      prediction_type: "x0"
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.div2k_dataset.DIV2KDataset
        root_dir: data/div2k/val
        target_shape: ${target_shape}
      noise_schedule: "cosine"
      prediction_type: "x0"
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    persistent_workers: true
    drop_last: false
  test:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.div2k_dataset.DIV2KDataset
        root_dir: data/div2k/val
        target_shape: ${target_shape}
      prediction_type: "x0"
      noise_schedule: "cosine"
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    persistent_workers: true
    drop_last: false

# Training overrides
lr: 0.00025
num_epochs: 5000
validation_interval: 500
batch_size: 2
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 500
  checkpoint:
    save_every_n_epochs: 10

model_input_args:
  - "t"
  - "cond"

model:
  _target_: model.diffusion.DenoisingDiffusionModel
  timestep_model:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Embedding
        num_embeddings: 1000
        embedding_dim: 128
  prediction_type: "x0"
  noise_schedule: "cosine"
  data_normalized_minus1_1: true
  # Inference parameters
  inference_method: "ddim"
  start_timestep: 999
  num_denoising_steps: 100
  denoising_delta: 0.001
  # Debug settings
  debug_dir: debug/compression_conditional_attn_diffusion/
  debug_mode: false
  debug_save_interval: 10  # Save every 10 timesteps to avoid filling disk
  conditional_model:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: model.blocks.conv_block.ConvBlock
        in_channels: 3
        # 32x downsampling: 640/32=20, 960/32=30 → 20*30=600 spatial tokens
        channels: [12, 24, 48, 96, 192]
        kernel_sizes: [3, 3, 3, 3, 3]
        strides: [2, 2, 2, 2, 2]  # 32x downsampling (5 stages)
        paddings: [1, 1, 1, 1, 1]
      - _target_: model.nn_modules.Flatten
        start_dim: 2
      - _target_: model.nn_modules.Permute
        _args_: [0, 2, 1]
  model:
    _target_: model.conditional_autoencoder.ConditionalAutoencoder
    encoder:
      _target_: model.combiner.DiffusionCombiner
      pass_through_args: true
      model:
        _target_: model.blocks.conditional_conv_block.ConditionalConvStage
        in_channels: 3
        channels: [12, 24, 48, 96, 192]
        time_embed_dim: 128
        cond_embed_dim: 192
        num_groups: [1, 6, 6, 6, 6]
        dropout: 0.2
        use_cross_attn: [False, False, True, True, True]
        cross_attn_num_heads: [1, 4, 4, 4, 4]
        downsample: [False, True, True, True, True]
        upsample: [False, False, False, False, False]
    decoder:
      _target_: model.combiner.DiffusionCombiner
      pass_through_args: true
      model:
        _target_: model.blocks.conditional_conv_block.ConditionalConvStage
        in_channels: 192
        channels: [96, 48, 24, 12, 6, 6, 3]
        time_embed_dim: 128
        cond_embed_dim: 192
        num_groups: [8, 8, 8, 6, 2, 2, 1]
        dropout: 0.2
        use_cross_attn: [True, True, True, False, False, False, False]
        cross_attn_num_heads: [4, 4, 4, 4, 2, 2, 1]
        downsample: [False, False, False, False, False, False, False]
        upsample: [True, True, True, True, False, False, False]
