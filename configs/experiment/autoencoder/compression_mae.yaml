# @package _global_
# Masked Autoencoder for image compression on DIV2K
#
# Usage: python src/trainer.py experiment/autoencoder/compression_mae

defaults:
  - /default
  - /dataset: div2k
  - /model: mae_div2k
  - /loss: masked_loss
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - _self_

experiment_name: compression_autoencoder_mae_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

# Training overrides
lr: 0.000075
num_epochs: 1000
validation_interval: 50
batch_size: 16

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 100
  checkpoint:
    save_every_n_epochs: 25
