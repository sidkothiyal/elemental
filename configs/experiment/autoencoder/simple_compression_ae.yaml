# @package _global_
# Simple Compression Autoencoder (ConvBlock encoder + UpsampleBlock decoder) on DIV2K
#
# Usage: python src/trainer.py experiment/autoencoder/simple_compression_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: simple_autoencoder
  - /loss: phased_mse_ssim
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_simple_ae_8x_phased_mse_ssim_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

# resume_training: true
# load_checkpoint_path: latest

mode: "autoencoder"

# Training overrides
lr: 0.0003
num_epochs: 2500
validation_interval: 500
batch_size: 48

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 500
  checkpoint:
    save_every_n_epochs: 10

# Log reconstructions/targets as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
