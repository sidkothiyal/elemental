# @package _global_
# Simple Compression VQ-Autoencoder (ConvBlock encoder + VQ bottleneck + UpsampleBlock decoder) on DIV2K
# Finetunes on top of a pretrained `compression_ae` checkpoint.
#
# Usage: python src/trainer.py experiment/autoencoder/compression_vq_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: simple_vq_autoencoder  # <-- VQ model instead of simple_autoencoder
  - /loss: phased_mse_ssim         # match the pretraining objective
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_vq_ae_8x_finetune_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

# Finetune from pretrained simple_autoencoder. Note: simple_autoencoder is an
# nn.Sequential (keys 0.*/1.*/2.*) while VQVAE uses encoder.*/decoder.* — run a
# checkpoint surgery pass first to remap keys, otherwise strict=false will
# silently match zero parameters.
resume_training: false
load_checkpoint_path: results/autoencoder/compression_simple_ae_8x_mse_10000epochs/last.vqvae.pt
load_keys: [model]   # only load model weights, not optimizer/scheduler/criterion
strict: false        # VQ codebook + projection layers are new

mode: "autoencoder"

# Training overrides — finetuning, so lower LR and fewer epochs than from-scratch
lr: 0.00005
num_epochs: 1000
validation_interval: 100
batch_size: 18

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 100
  checkpoint:
    save_every_n_epochs: 10
