# @package _global_
# Simple Compression VQ-Autoencoder (ConvBlock encoder + VQ bottleneck + UpsampleBlock decoder) on DIV2K
#
# Usage: python src/trainer.py experiment/autoencoder/compression_vq_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: simple_vq_autoencoder  # <-- VQ model instead of simple_autoencoder
  - /loss: l1
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_vq_ae_8x_l1_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

resume_training: true
load_checkpoint_path: latest

mode: "autoencoder"

# Training overrides
lr: 0.0003
num_epochs: 5000
validation_interval: 500
batch_size: 48

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 500
  checkpoint:
    save_every_n_epochs: 10
