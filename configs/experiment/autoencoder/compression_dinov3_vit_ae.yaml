# @package _global_
# Compression Autoencoder — DINOv3 ViT-S/16 frozen encoder + ViT-based decoder
# on DIV2K.  Only the decoder is trained; the encoder acts as a fixed feature extractor.
#
# The decoder mirrors the encoder's ViT architecture: 8 transformer layers with
# 384-dim embeddings and 6 attention heads, followed by convolutional refinement
# layers that eliminate patch-boundary blockiness in the reconstruction.
#
# Decoder is ~17 M trainable params (vs ~1 M for the conv-only variant).
#
# Usage: python src/trainer.py experiment/autoencoder/compression_dinov3_vit_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: dinov3_vit_decoder_ae
  - /loss: mse
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_dinov3_vit_ae_mse_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

resume_training: true
load_checkpoint_path: latest

mode: "autoencoder"

# Larger decoder requires lower LR and smaller batch size
lr: 0.0001
num_epochs: 1000
validation_interval: 100
batch_size: 6

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

callbacks:
  wandb:
    logging_interval: 100
  checkpoint:
    save_every_n_epochs: 10

# Log reconstructions/targets as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
