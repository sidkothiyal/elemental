# @package _global_
# Compression Autoencoder — DINOv2 ViT-S/14 frozen encoder + custom convolutional decoder
# on DIV2K.  Only the decoder is trained; the encoder acts as a fixed feature extractor.
#
# Usage: python src/trainer.py experiment/autoencoder/compression_dinov2_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: dinov2_decoder_ae
  - /loss: mse
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_dinov2_ae_mse_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

# DINOv2 uses patch_size=14.  The default DIV2K crop (640×1024) is not divisible by 14,
# so we scale proportionally: 14/16 × [640, 1024] = [560, 896].
# Both are exact multiples of 14 (560=14×40, 896=14×64) giving the same 40×64 patch
# grid as DINOv3 running on the full 640×1024 crop.
target_shape: [560, 896]

# Training overrides — only the decoder (~1 M params) is updated
lr: 0.0001
num_epochs: 500
validation_interval: 100
# Reduced batch size: frozen encoder still occupies VRAM during the forward pass
batch_size: 16

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 100
  checkpoint:
    save_every_n_epochs: 10

# Log reconstructions/targets as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
