# @package _global_
# Compression Autoencoder — DINOv3 ViT-S/16 frozen encoder + custom convolutional decoder
# on DIV2K.  Only the decoder is trained; the encoder acts as a fixed feature extractor.
#
# Usage: python src/trainer.py experiment/autoencoder/compression_dinov3_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: dinov3_decoder_ae
  - /loss: mse
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_dinov3_ae_mse_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

resume_training: true
load_checkpoint_path: latest

mode: "autoencoder"

# Training overrides — only the decoder (~1 M params) is updated
lr: 0.0003
num_epochs: 1000
validation_interval: 100
# Reduced batch size: frozen encoder still occupies VRAM during the forward pass
batch_size: 32

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 100
  checkpoint:
    save_every_n_epochs: 10

# Log reconstructions/targets as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
