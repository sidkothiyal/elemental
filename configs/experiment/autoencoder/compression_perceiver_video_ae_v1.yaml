# @package _global_
# Phase 2 V1: Perceiver Resampler video autoencoder on BVI-AOM.
# Single shared latent array per N-frame chunk, no per-frame residual.
# Bottleneck size: num_latents x latent_dim = 64 x 256 = 16384 floats per
# chunk (independent of T and of the input spatial size — the spatial PE
# and decoder query grid bicubic-interpolate at runtime).
#
# Loss: MSE (SSIM requires 4-D and is deferred — see compression_3d_ae.yaml).
#
# Resolution policy: BVI-AOM clips arrive at the resolution selected via
# `bvi_aom_resolutions` (the dataset must be configured to a single resolution
# at a time, or use `target_shape` to crop). The patch CNN's 8x cumulative
# downsample sets the runtime patch grid; the model's `base_grid_h`/
# `base_grid_w` should be the patch grid at the canonical training resolution.
# At 272p (~480x272) cropped to 256x256 -> 32x32 patch grid; at 64x64 ->
# 8x8 patch grid. Override `base_grid_h`/`base_grid_w` and `target_shape` to
# match.
#
# Usage:
#   uv run python src/trainer.py experiment/autoencoder/compression_perceiver_video_ae_v1

defaults:
  - /default
  - /dataset: bvi_aom
  - /model: perceiver_video_autoencoder
  - /loss: mse
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/video_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_perceiver_video_ae_v1_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

# Smoke-friendly defaults: 64x64 crops + 8 frames -> 8x8 patch grid.
clip_length: 8
target_shape: [64, 64]
base_grid_h: 8
base_grid_w: 8

lr: 0.0003
num_epochs: 1000
validation_interval: 200
batch_size: 16

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# The decoder's `q.expand(B, ...)` may trip fullgraph compilation. Disable
# fullgraph for this experiment.
torch_compile:
  fullgraph: false

callbacks:
  wandb:
    logging_interval: 200
  checkpoint:
    save_every_n_epochs: 10

# Log 5-D clips as videos in W&B.
to_log:
  input/input: video
  target: video
  pred: video
