# @package _global_
# Fast Compression Autoencoder on DIV2K.
#
# Sibling of `compression_ae` using `fast_residual_autoencoder` instead of
# `residual_autoencoder` - same 8x downsample / 256-d bottleneck and same
# L1 + perceptual loss, but ~5x fewer FLOPs per forward pass.
#
# Usage: python src/trainer.py experiment/autoencoder/fast_compression_ae

defaults:
  - /default
  - /dataset: div2k
  - /model: fast_residual_autoencoder
  - /loss: l1_perceptual
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /callback/image_reconstruction_metrics@callbacks.metrics
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: fast_compression_ae_8x_l1_perceptual_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

resume_training: true
load_checkpoint_path: latest

# torch.compile - static shapes, simple ops -> safe to compile aggressively.
torch_compile:
  enabled: true
  mode: "max-autotune-no-cudagraphs"  # best kernels; skip cudagraphs (plays poorly with grad accum)
  backend: "inductor"
  fullgraph: true       # AE has no graph breaks; catch regressions early
  dynamic: false        # fixed 640x1024, no recompiles needed
  compile_optimizer_step: true

mode: "autoencoder"

# Training overrides
lr: 0.0003
num_epochs: 1000
validation_interval: 200
# Smaller model fits at higher per-step batch; effective batch = 16 matches
# `compression_ae` (4 * 4) for fair comparison.
batch_size: 24
grad_accum_steps: 2

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Override callbacks
callbacks:
  wandb:
    logging_interval: 200
  checkpoint:
    save_every_n_epochs: 10

# Log reconstructions/targets as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
