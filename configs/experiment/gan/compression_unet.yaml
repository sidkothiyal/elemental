# @package _global_
# GAN for image compression using UNet generator on DIV2K
#
# Usage: python src/trainer.py experiment/gan/compression_unet

defaults:
  - /default
  - /dataset: div2k
  - /model: gan_compression_unet
  - /loss: gan_compression
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: compression_autoencoder_gan_unet_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/gan/

mode: "gan"

# Training overrides
lr: 0.0005
num_epochs: 500
validation_interval: 25
batch_size: 32
clip_grad_norm: 1.0

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Log inputs/targets/reconstructions as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
