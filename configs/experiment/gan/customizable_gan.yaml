# @package _global_
# GAN for image compression expressed declaratively via CustomizableTrainer.
#
# The per-batch graph is defined in configs/graph/gan_per_batch.yaml and
# composed via Hydra defaults. It reproduces the three-phase choreography
# in GANTrainer.train_batch using only primitive ExecuteFunction nodes.
#
# Numerical parity with GANTrainer is enforced by
# `TestYamlGanGraphParity` in tests/integration/test_customizable_trainer_loops.py
# (valid for the happy path: training=True, scaler disabled, clip_grad_norm unset).
#
# Usage: python src/trainer.py experiment/gan/customizable_gan

defaults:
  - /default
  - /dataset: div2k
  - /model: gan_compression_unet
  - /loss: gan_compression
  - /optimizer: adamw
  - /scheduler: cosine_annealing
  - /callback: default
  - /graph: gan_per_batch
  - /torch_compile
  - /remote_backup: wandb
  - _self_

experiment_name: gan_customizable_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/gan/

mode: "customizable"

# Training overrides
lr: 0.0005
num_epochs: 500
validation_interval: 25
batch_size: 32

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

# Metric formatting — matches GANTrainer._format_metrics output names
metrics_format:
  generator: generator_loss
  discriminator: discriminator_loss

# Log inputs/targets/reconstructions as images in W&B.
to_log:
  input/input: image
  target: image
  pred: image
