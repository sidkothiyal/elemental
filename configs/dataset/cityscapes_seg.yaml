# @package _global_
# Cityscapes dataset configuration for segmentation
dataset_name: cityscapes_seg

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/train
      segmentation_enabled: true
      depth_enabled: false
      rename_output_keys:
        seg_mask: target
    batch_size: ${batch_size}
    shuffle: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/val
      segmentation_enabled: true
      depth_enabled: false
      rename_output_keys:
        seg_mask: target
    batch_size: ${batch_size}
    shuffle: false
  test: null
