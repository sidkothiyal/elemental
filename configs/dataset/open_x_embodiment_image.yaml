# @package _global_
# Open X-Embodiment dataset configuration for image autoencoder training.
# Returns {input: image, target: image} for reconstruction tasks.
data_dir: data/open_x_embodiment/fractal20220817_data/0.1.0

# Dataset parameters
num_episodes: null        # null = all episodes, set to a number for quick testing
image_size: null          # null = original size (256, 320), or tuple like [224, 224]
normalize_images: true
include_images: true
language_mode: none       # images only — no language needed for autoencoder
successful_only: true
normalize_actions: false  # not used for image autoencoder
num_action_chunks: 1      # not used for image autoencoder

# Field renaming: duplicate image as both input and target for autoencoder mode
rename_outputs:
  image:
    - input
    - target

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
      data_dir: ${data_dir}
      split: train
      num_episodes: ${num_episodes}
      image_size: ${image_size}
      normalize_images: ${normalize_images}
      include_images: ${include_images}
      language_mode: ${language_mode}
      successful_only: ${successful_only}
      normalize_actions: ${normalize_actions}
      num_action_chunks: ${num_action_chunks}
      rename_outputs: ${rename_outputs}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 12
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
      data_dir: ${data_dir}
      split: val
      num_episodes: ${num_episodes}
      image_size: ${image_size}
      normalize_images: ${normalize_images}
      include_images: ${include_images}
      language_mode: ${language_mode}
      successful_only: ${successful_only}
      normalize_actions: ${normalize_actions}
      num_action_chunks: ${num_action_chunks}
      rename_outputs: ${rename_outputs}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
  test:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
      data_dir: ${data_dir}
      split: val
      num_episodes: ${num_episodes}
      image_size: ${image_size}
      normalize_images: ${normalize_images}
      include_images: ${include_images}
      language_mode: ${language_mode}
      successful_only: ${successful_only}
      normalize_actions: ${normalize_actions}
      num_action_chunks: ${num_action_chunks}
      rename_outputs: ${rename_outputs}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
