# @package _global_
# Open X-Embodiment dataset wrapped by DiffusionDataset for VLA action diffusion.
# The observation image (and optional text) conditions the denoising; action chunks are the target.

data_dir: data/open_x_embodiment/fractal20220817_data/0.1.0
num_episodes: null        # null = all episodes; override for quick testing (e.g. num_episodes: 2)
image_size: null          # null = original size (256, 320), or tuple like [224, 224]
normalize_images: true
include_images: true
language_mode: raw        # raw, embedding, both, or none (test split hardcodes "none")
successful_only: true     # only use successful episodes
normalize_actions: true
action_normalization_method: quantile  # quantile (default), gaussian, or minmax
stats_path: null          # null = auto-detect in data_dir

# Action / diffusion constants — override in experiment if needed
action_dim: 7
num_action_chunks: 20
num_diffusion_timesteps: 100
prediction_type: x0
noise_schedule: cosine
cond_key: [image, text]

rename_outputs:
  action_chunk: target
  natural_language_instruction: text

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
        data_dir: ${data_dir}
        split: train
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: ${language_mode}
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        action_normalization_method: ${action_normalization_method}
        stats_path: ${stats_path}
        num_action_chunks: ${num_action_chunks}
        episode_cache_size: 1024
        rename_outputs: ${rename_outputs}
      num_timesteps: ${num_diffusion_timesteps}
      prediction_type: ${prediction_type}
      noise_schedule: ${noise_schedule}
      cond_key: ${cond_key}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    drop_last: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
        data_dir: ${data_dir}
        split: val
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: ${language_mode}
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        action_normalization_method: ${action_normalization_method}
        stats_path: ${stats_path}
        num_action_chunks: ${num_action_chunks}
        episode_cache_size: 1024
        rename_outputs: ${rename_outputs}
      num_timesteps: ${num_diffusion_timesteps}
      prediction_type: ${prediction_type}
      noise_schedule: ${noise_schedule}
      cond_key: ${cond_key}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    drop_last: false
    prefetch_factor: 128
  test:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentDataset
        data_dir: ${data_dir}
        split: val
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: none   # no language instruction during test inference
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        action_normalization_method: ${action_normalization_method}
        stats_path: ${stats_path}
        num_action_chunks: ${num_action_chunks}
        episode_cache_size: 1024
        rename_outputs: ${rename_outputs}
      num_timesteps: ${num_diffusion_timesteps}
      prediction_type: ${prediction_type}
      noise_schedule: ${noise_schedule}
      cond_key: ${cond_key}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    drop_last: false
    prefetch_factor: 128
