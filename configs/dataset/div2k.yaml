# @package _global_
# DIV2K dataset configuration for image compression/autoencoder tasks
dataset_name: div2k
target_shape: [640, 1024]

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: ${target_shape}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: ${target_shape}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  test: null
