# @package _global_
# Tiny Shakespeare dataset configuration for character-level LM
dataset_name: tiny_shakespeare
max_length: 256

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.tiny_shakespeare_dataset.TinyShakespeareDataset
      dataset_dir: data/tiny_shakespeare
      split: train
      block_size: ${max_length}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.tiny_shakespeare_dataset.TinyShakespeareDataset
      dataset_dir: data/tiny_shakespeare
      split: val
      block_size: ${max_length}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  test: null
