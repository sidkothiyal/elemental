# @package _global_
# Open X-Embodiment dataset for next-frame prediction.
# Wraps OpenXEmbodimentSequenceDataset with FramePredictionDataset to split
# image sequences into context frames (input) and target frame.
data_dir: data/open_x_embodiment/fractal20220817_data/0.1.0

# Dataset parameters
num_episodes: null
# sequence_length = num_context_frames + 1 (context + target)
sequence_length: 5            # 4 context + 1 target
stride: 4                     # stride between sequence start positions
image_size: null              # null = original (256, 320)
normalize_images: true
include_images: true
language_mode: none
successful_only: true
normalize_actions: false
num_action_chunks: 1

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.frame_prediction_dataset.FramePredictionDataset
      image_key: image
      base_dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentSequenceDataset
        data_dir: ${data_dir}
        split: train
        sequence_length: ${sequence_length}
        stride: ${stride}
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: ${language_mode}
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        num_action_chunks: ${num_action_chunks}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 12
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.frame_prediction_dataset.FramePredictionDataset
      image_key: image
      base_dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentSequenceDataset
        data_dir: ${data_dir}
        split: val
        sequence_length: ${sequence_length}
        stride: ${stride}
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: ${language_mode}
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        num_action_chunks: ${num_action_chunks}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
  test:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.frame_prediction_dataset.FramePredictionDataset
      image_key: image
      base_dataset:
        _target_: dataset.open_x_embodiment.OpenXEmbodimentSequenceDataset
        data_dir: ${data_dir}
        split: val
        sequence_length: ${sequence_length}
        stride: ${stride}
        num_episodes: ${num_episodes}
        image_size: ${image_size}
        normalize_images: ${normalize_images}
        include_images: ${include_images}
        language_mode: ${language_mode}
        successful_only: ${successful_only}
        normalize_actions: ${normalize_actions}
        num_action_chunks: ${num_action_chunks}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
