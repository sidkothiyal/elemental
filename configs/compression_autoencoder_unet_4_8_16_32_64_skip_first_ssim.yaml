experiment_name: compression_autoencoder_unet_4_8_16_32_64_skip_first_weighted_ms_ssim_mse_1_100_loss_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.0005
num_epochs: 500
validation_interval: 25
test: false
batch_size: 64
seed: 42
dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

clip_grad_norm: 1.0
device: "accelerated"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 50
    mode: ${mode}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  test: null

loss:
  _target_: loss.phased_loss.PhasedLoss
  total_epochs: ${num_epochs}
  phases:
    - loss:
        _target_: torch.nn.L1Loss
      run_until: 0.2
    - loss:
        _target_: loss.moving_weighted_loss.MovingWeightedLoss
        start_weights: [10.0, 0.0]
        end_weights: [9.0, 1.0]
        start_percentage: 0.2
        end_percentage: 0.8
        total_epochs: ${num_epochs}
        scale_losses: true
        loss_fns:
          - _target_: torch.nn.L1Loss
          - _target_: loss.ssim.SSIMLoss
            multi_scale: true
            ssim_kwargs:
              data_range: 1.0
              size_average: True
              channel: 3
      run_until: 0.8
    - loss:
        _target_: loss.weighted_loss.WeightedLoss
        weights: [9.0, 1.0]
        scale_losses: true
        loss_fns:
          - _target_: torch.nn.L1Loss
          - _target_: loss.ssim.SSIMLoss
            multi_scale: true
            ssim_kwargs:
              data_range: 1.0
              size_average: True
              channel: 3
      run_until: 1.0

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

# lr_scheduler: "StepLR"
# lr_scheduler_params:
#   step_size: 25
#   gamma: 0.9

model:
  _target_: model.unet.UNet
  in_channels: 3
  out_channels: 3
  channels: [4, 8, 16, 32, 64]
  skip_first_connection: true
