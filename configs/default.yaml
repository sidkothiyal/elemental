# Default training configuration - base values shared across all experiments

# Training parameters
lr: 0.0001
num_epochs: 100
test: false
batch_size: 64
seed: 42

# Device configuration
device: "gpu"
# Use channels_last (NHWC) memory format on CUDA for image workloads.
# Eliminates NCHW↔NHWC layout conversions inside cuDNN.
# Only applies to 4D tensors after batching; no effect on CPU or non-image tasks.
channels_last: true
# Auto-tune cuDNN conv algorithm per (input size, kernel, layout).
# Best for fixed-size inputs. Adds warmup cost on first batch.
cudnn_benchmark: true

# Optional parameters (set to null if not used)
# Interval (in epochs) at which torch.cuda.empty_cache() is called to defragment GPU memory.
# 0 = disabled (recommended for most runs); n = runs every n epochs.
cuda_empty_cache_interval: 0
validation_interval: 5
# Mid-training held-out eval every N optimizer steps (independent of the
# epoch-based validation_interval above). null/0 disables; pair with
# validation_max_batches to keep each eval short. Useful for streaming
# IterableDatasets whose epoch never ends.
validation_interval_steps: null
validation_max_batches: null
# Steps between per-batch metric logs to callbacks (e.g. W&B loss curves).
# 0 disables; the epoch-end average is always logged regardless.
log_interval: 50
gradient_accumulation_steps: 1
clip_grad_norm: null
# When true, a non-finite (NaN/Inf) training loss drops the current
# accumulation window and continues (counted as train/skipped_steps) instead of
# raising NaNLossError. Off by default (fail-fast).
skip_nonfinite_steps: false
# Device peak FLOP/s for the MFU estimate (throughput/mfu). null → MFU not
# logged (only throughput/tokens_per_sec and achieved_tflops). E.g. ~9.9e14 for
# an H100 bf16 (no sparsity).
peak_flops_per_sec: null
dtype: null

# Default optimizer and scheduler (trainer.py uses these strings with getattr)
optimizer: "AdamW"
lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

# Checkpoint loading (optional)
load_checkpoint_path: null
load_keys: null
strict: true
resume_training: false

# Post-processor pipeline (null disables post-processing)
postprocessors: null

# Controls which data-container keys WandbCallback logs (null = log everything)
to_log: null

# Profiler configuration (null disables profiling)
profiler: null

# Remote backup strategy (null disables remote backup)
remote_backup: null

# Trial budget (autoresearch / hyperparameter search). Both null = no limit.
# max_steps: hard cap on OPTIMIZER steps (accumulation boundaries, not
#   micro-batches) — same unit as the LR scheduler's total_steps, so setting
#   max_steps == total_steps ends the run exactly when the schedule does.
#   Short-circuits the epoch loop; essential for streaming IterableDatasets
#   whose epoch length is undefined.
# max_wall_time_sec: wall-clock cap in seconds from train() entry.
max_steps: null
max_wall_time_sec: null
