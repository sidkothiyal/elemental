experiment_name: compression_autoencoder_unet_4_8_16_32_64_skip_first_l1_loss_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.00025
num_epochs: 100
validation_interval: 10
test: false
batch_size: 48
seed: 42

device: "accelerated"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 50
    mode: ${mode}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
  test: null

loss:
  _target_: torch.nn.MSELoss
  # _target_: torch.nn.L1Loss

lr_scheduler_params:
  step_size: 10
  gamma: 0.75

model:
  _target_: model.unet.UNet
  in_channels: 3
  out_channels: 3
  channels: [4, 8, 16, 32, 64]
  skip_first_connection: true
  # Vanilla CNN based autoencoder
