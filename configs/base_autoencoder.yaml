experiment_name: autoencoder_seg_cityscapes_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.0001
num_epochs: 100
test: false
batch_size: 64
seed: 42

device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 50
    mode: ${mode}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/train
      segmentation_enabled: false
      depth_enabled: true
      rename_output_keys:
        depth: target
    batch_size: ${batch_size}
    shuffle: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/val
      segmentation_enabled: false
      depth_enabled: true
      rename_output_keys:
        depth: target
    batch_size: ${batch_size}
    shuffle: false
  test: null

loss:
  _target_: torch.nn.MSELoss

lr_scheduler_params:
  step_size: 10
  gamma: 0.75

model:
  _target_: model.unet.UNet
  in_channels: 3
  out_channels: 1
