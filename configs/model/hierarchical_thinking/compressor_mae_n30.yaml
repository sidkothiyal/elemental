# @package _global_
# Stage-1 MAE pretrain for the N=30 ("sentence"-scale) sliding Perceiver
# compressor. Sizing matches stream 2 of the joint MultiScaleLM:
# latent_dim=tower.embed_dim=768.

vocab_size: 65537
mask_token_id: 65536
embed_dim: 768                            # MUST match MultiScaleLM token_embed_dim
window_size: 30
latent_dim: 768                           # MUST match MultiScaleLM stream 2 tower.embed_dim
max_length: 2048
mask_ratio: 0.5

model:
  _target_: model.compressor_mae.CompressorMAE
  vocab_size: ${vocab_size}
  mask_token_id: ${mask_token_id}
  embed_dim: ${embed_dim}
  max_length: ${max_length}
  mask_ratio: ${mask_ratio}
  decoder_num_layers: 6
  decoder_num_heads: 12
  decoder_ff_embed_dim: 3072

  compressor:
    _target_: model.sliding_perceiver_compressor.SlidingPerceiverCompressor
    window_size: ${window_size}
    stride: ${window_size}
    in_dim: ${embed_dim}
    latent_dim: ${latent_dim}
    num_layers: 4
    num_heads: 12
    ff_embed_dim: 3072
