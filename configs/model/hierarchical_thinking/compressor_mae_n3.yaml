# @package _global_
# Stage-1 MAE pretrain for the N=3 ("word"-scale) sliding Perceiver compressor.
# Compressor + token embedding sizing matches stream 0 of the joint
# MultiScaleLM (multi_scale_lm_v0.yaml): in_dim=token_embed_dim=768,
# latent_dim=tower.embed_dim=512. The pretrained compressor + token
# embedding weights slot directly into the joint model via checkpoint
# surgery.

vocab_size: 65537                         # nanochat BPE + <|mask|> sentinel
mask_token_id: 65536
embed_dim: 768                            # MUST match MultiScaleLM token_embed_dim
window_size: 3
latent_dim: 512                           # MUST match MultiScaleLM stream 0 tower.embed_dim
max_length: 2048
mask_ratio: 0.5

model:
  _target_: model.compressor_mae.CompressorMAE
  vocab_size: ${vocab_size}
  mask_token_id: ${mask_token_id}
  embed_dim: ${embed_dim}
  max_length: ${max_length}
  mask_ratio: ${mask_ratio}
  decoder_num_layers: 4
  decoder_num_heads: 8
  decoder_ff_embed_dim: 2048

  compressor:
    _target_: model.sliding_perceiver_compressor.SlidingPerceiverCompressor
    window_size: ${window_size}
    stride: ${window_size}
    in_dim: ${embed_dim}
    latent_dim: ${latent_dim}
    num_layers: 4
    num_heads: 8
    ff_embed_dim: 2048
