# @package _global_
# Simple 3D-conv video autoencoder.
#
# Encoder: spatial 8x downsample, temporal 2x downsample. GroupNorm(32) + SiLU.
# Decoder: matching trilinear upsampling stack with 3D refinement convs.
#
# Input layout (from collation): (B, T, C, H, W) in [-1, 1]; clip_length=8 from
# BVI-AOM. Permute to/from (B, C, T, H, W) bracket the 3D conv stack so this
# config can be dropped into the standard `model.autoencoder.Autoencoder`.
#
# Bottleneck shape for clip_length=8, target_shape=[H, W] inputs:
#   (B, 256, T/2, H/8, W/8)
model:
  _target_: model.autoencoder.Autoencoder
  encoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: model.nn_modules.Permute    # (B,T,C,H,W) -> (B,C,T,H,W)
        _args_: [0, 2, 1, 3, 4]
      - _target_: model.blocks.conv3d_block.ConvBlock3d
        in_channels: 3
        channels: [64, 128, 256]
        kernel_sizes: [[3, 3, 3], [3, 3, 3], [3, 3, 3]]
        strides:     [[1, 2, 2], [2, 2, 2], [1, 2, 2]]
        paddings:    [[1, 1, 1], [1, 1, 1], [1, 1, 1]]
        norm:
          _target_: hydra.utils.get_class
          path: torch.nn.GroupNorm
        norm_kwargs: {num_groups: 32}
        act:
          _target_: hydra.utils.get_class
          path: torch.nn.SiLU
  decoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: model.blocks.upsample3d_block.Upsample3dBlock
        scale_factors: [[1, 2, 2], [2, 2, 2], [1, 2, 2]]
        modes: trilinear
        align_corners: false
        in_channels: 256
        channels: [128, 64, 32]
        kernel_sizes: [[3, 3, 3], [3, 3, 3], [3, 3, 3]]
        paddings:     [[1, 1, 1], [1, 1, 1], [1, 1, 1]]
        norm:
          _target_: hydra.utils.get_class
          path: torch.nn.GroupNorm
        norm_kwargs: {num_groups: 32}
        act:
          _target_: hydra.utils.get_class
          path: torch.nn.SiLU
      - _target_: torch.nn.Conv3d
        in_channels: 32
        out_channels: 3
        kernel_size: 3
        stride: 1
        padding: 1
      - _target_: model.nn_modules.Permute    # (B,C,T,H,W) -> (B,T,C,H,W)
        _args_: [0, 2, 1, 3, 4]
