# @package _global_
# DINOv3 ViT-S/16 encoder (frozen) + custom convolutional decoder autoencoder.
#
# Encoder:  facebook/dinov3-vits16-pretrain-lvd1689m  (patch_size=16, embed_dim=384)
#   processor_kwargs disable resizing so the native dataset resolution is preserved.
#   interpolate_pos_encoding=true lets the ViT handle non-224 sizes.
#   Patch grid is computed dynamically: H//16 × W//16.
#
# Decoder:  4× bilinear-upsample + conv stages (16× total),
#           followed by a conv to RGB.
model:
  _target_: model.autoencoder.HFVisionAutoencoder
  patch_size: 16  # DINOv3 ViT-S/16 — patch grid is H//16 × W//16

  encoder:
    _target_: model.hf_vision.HFVisionEncoder
    model_name: "facebook/dinov3-vits16-pretrain-lvd1689m"
    return_layers: null
    torch_dtype: "bfloat16"
    attn_implementation: "sdpa"
    device_map: "auto"
    freeze_model: true
    interpolate_pos_encoding: true  # required for non-224 input sizes
    processor_kwargs:
      do_resize: false              # preserve native image resolution
      do_center_crop: false

  decoder:
    _target_: torch.nn.Sequential
    _args_:
      # 4× bilinear upsample stages → 16× total upsampling
      # Channel reduction: 384 → 256 → 128 → 64 → 32
      - _target_: model.blocks.upsample_block.UpsampleBlock
        scale_factors: [2.0, 2.0, 2.0, 2.0]
        modes: bilinear
        align_corners: false
        in_channels: 384
        channels: [256, 128, 64, 32]
        kernel_sizes: [3, 3, 3, 3]
        paddings: [1, 1, 1, 1]
      # Final projection to RGB (no norm / activation)
      - _target_: torch.nn.Conv2d
        in_channels: 32
        out_channels: 3
        kernel_size: 3
        stride: 1
        padding: 1
