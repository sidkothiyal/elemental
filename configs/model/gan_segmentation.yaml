# @package _global_
# GAN model configuration for segmentation
num_classes: 31

model:
  _target_: torch.nn.ModuleDict
  modules:
    generator:
      _target_: model.unet.UNet
      in_channels: 3
      out_channels: ${num_classes}

    discriminator:
      _target_: model.blocks.ConvBlock
      in_channels: ${num_classes}
      channels: [64, 128, 256, 512, 1]
      kernel_sizes: [4, 4, 4, 4, 4]
      strides: [2, 2, 2, 1, 1]
      paddings: [1, 1, 1, 1, 1]
