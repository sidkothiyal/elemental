# @package _global_
# Nanochat-style GPT — d12 tier (smallest; ~smolnano).
vocab_size: 65536
embed_dim: 768
num_heads: 6
num_layers: 12
ff_embed_dim: 3072
max_length: 2048
rope_base: 10000.0

model:
  _target_: model.nanochat_gpt.NanochatGPT
  vocab_size: ${vocab_size}
  embed_dim: ${embed_dim}
  num_heads: ${num_heads}
  num_layers: ${num_layers}
  ff_embed_dim: ${ff_embed_dim}
  max_length: ${max_length}
  rope_base: ${rope_base}
