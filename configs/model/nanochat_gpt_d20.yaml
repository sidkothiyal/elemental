# @package _global_
# Nanochat-style GPT — d20 tier (matches the speedrun.sh default).
vocab_size: 65536
embed_dim: 1280
num_heads: 10
num_layers: 20
ff_embed_dim: 5120
max_length: 2048
rope_base: 10000.0

model:
  _target_: model.nanochat_gpt.NanochatGPT
  vocab_size: ${vocab_size}
  embed_dim: ${embed_dim}
  num_heads: ${num_heads}
  num_layers: ${num_layers}
  ff_embed_dim: ${ff_embed_dim}
  max_length: ${max_length}
  rope_base: ${rope_base}
