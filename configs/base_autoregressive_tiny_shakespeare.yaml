experiment_name: autoregressive_tiny_shakespeare_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoregressive_tiny_shakespeare/

mode: "autoregressive"

lr: 0.0003
num_epochs: 10000
test: false
batch_size: 64
gradient_accumulation_steps: 1
seed: 42
validation_interval: 1000
checkpoint_interval: 1000

device: "gpu"

max_length: 256
pretrained_tokenizer: null
vocab_size: 65
embedding_dim: 384
ff_embed_dim: 768

num_heads: 1
num_layers: 1

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 100
    mode: ${mode}
    log_text_data: true
    tokenizer: ${pretrained_tokenizer}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.tiny_shakespeare_dataset.TinyShakespeareDataset
      dataset_dir: data/tiny_shakespeare
      split: train
      block_size: ${max_length}
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.tiny_shakespeare_dataset.TinyShakespeareDataset
      dataset_dir: data/tiny_shakespeare
      split: val
      block_size: ${max_length}
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  test: null

loss:
  _target_: loss.shifted_teacher_forcing.ShiftedTeacherForcing
  shift: 0
  loss_fn:
    _target_: torch.nn.CrossEntropyLoss
    # ignore_index: 50256

lr_scheduler_params:
  step_size: 500
  gamma: 0.9

model:
  _target_: model.autoregressive_lm.AutoregressiveLM
  encoder:
    _target_: model.transformer.Transformer
    embed_dim: ${embedding_dim}
    num_heads: ${num_heads}
    num_layers: ${num_layers}
    ff_embed_dim: ${ff_embed_dim}
    dropout: 0.2
    attention_dropout: 0.2
  token_embedding: null
  positional_embedding: null
  embedding_dim: ${embedding_dim}
  max_length: ${max_length}
  pretrained_tokenizer: ${pretrained_tokenizer}
  vocab_size: ${vocab_size}
