# @package _global_
# Muon + AdamW recipe for RecursiveMemoryGPT. Same sub-optimizers as muon_adamw,
# but the partition additionally routes the PEER bank (expert tables, sub-keys)
# and the loop-conditioning embedding to AdamW — Newton-Schulz on a
# (num_experts, d) table would OOM. See optimizer.param_groups.recursive_memory_default.
optimizer_groups:
  muon:
    _target_: optimizer.muon.Muon
    lr: 0.02
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 0.0
  adamw:
    _target_: torch.optim.AdamW
    lr: 0.0008
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.0

optimizer_partition:
  _target_: optimizer.param_groups.recursive_memory_default

lr: 0.02
