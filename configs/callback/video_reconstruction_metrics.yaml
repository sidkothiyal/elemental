# Video reconstruction metrics callback configuration.
#
# Wraps the standard image metrics (MSE, PSNR, SSIM) and applies a temporal
# flatten so they receive (B*T, C, H, W) tensors. Each per-frame value is
# accumulated, so the reported metric is an average over all frames in all
# clips of the epoch.
#
# Pixel data range: BVI-AOM (and DIV2K) normalise frames to [-1, 1], so the
# true data range is 2.0 — see the matching note in
# `image_reconstruction_metrics.yaml`.

_target_: callback.metrics_callback.MetricsCallback

metrics:
  mse:
    _target_: metrics.mse.MSE
    data_range: 2.0
    normalize: false
  psnr:
    _target_: metrics.psnr.PSNR
    data_range: 2.0
  ssim:
    _target_: metrics.ssim.SSIM
    data_range: 2.0
    win_size: 11
    win_sigma: 1.5

phases:
  train: 250
  val: 10
  test: 1

log_per_batch: false

pred_key: pred
target_key: target

transform_pred:
  _target_: callback.transforms.FlattenTemporal
transform_target:
  _target_: callback.transforms.FlattenTemporal
