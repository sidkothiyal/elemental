# Checkpoint callback configuration
_target_: callback.checkpoint_callback.CheckpointCallback
save_dir: ${results_dir}/${experiment_name}
save_every_n_epochs: 10
save_every_n_steps: null
save_best: true
save_last: true
# The trainer emits losses as ``loss_<name>`` (see Trainer._format_metrics), so the
# monitored key is ``loss_total`` — NOT a bare ``total``, which matches nothing and
# silently disables best-checkpoint tracking.
monitor_metric: "loss_total"
mode: "min"
max_checkpoints_saved: 5
