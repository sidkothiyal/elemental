experiment_name: elemental_trial_cityscapes_gan_seg_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/gan/

mode: "gan"

lr: 0.0001
num_epochs: 100
test: false
batch_size: 8
seed: 42

device: "accelerated"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_images_to_log: 1
    logging_interval: 50
    num_classes: 31
    mode: ${mode}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/train
      segmentation_enabled: true
      depth_enabled: false
    batch_size: ${batch_size}
    shuffle: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/val
      segmentation_enabled: true
      depth_enabled: false
    batch_size: ${batch_size}
    shuffle: false
  test: null

loss:
  feature_matching:
    _target_: torch.nn.CrossEntropyLoss
  adversarial:
    _target_: torch.nn.BCEWithLogitsLoss

model:
  _target_: torch.nn.ModuleDict
  modules:
    generator:
      _target_: model.unet.UNet
      in_channels: 3
      out_channels: 31

    discriminator:
      _target_: model.blocks.ConvBlock
      in_channels: 31
      channels: [64, 128, 256, 512, 1]
      kernel_sizes: [4, 4, 4, 4, 4]
      strides: [2, 2, 2, 1, 1]
      paddings: [1, 1, 1, 1, 1]
