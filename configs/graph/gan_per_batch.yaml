# @package _global_
# Three-phase GAN per-batch graph for CustomizableTrainer.
#
# Works with any `model` that is a ModuleDict({generator, discriminator})
# and any `loss` dict exposing keys `adversarial` and `feature_matching`.
# Consumes `batch["input"]` and `batch["target"]` (both image tensors).
#
# Scope variables pre-seeded by CustomizableTrainer:
# `model`, `optim`, `loss_fn`, `scaler`, `config`, `device`, `dtype`,
# `batch`, `epoch`, `training`.
graph:
  _target_: nodes.graph_node.GraphNode
  name: GanPerBatch
  expose_all_outputs: true
  statements:
    # ==========================================
    # Phase 1: Discriminator on fake data
    # ==========================================

    # pred_target = model["generator"](batch["input"])
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1Generator
      function: node:model.generator
      args: ["node:batch.input"]
      inputs: []
      outputs: [pred_target_p1]

    # pred_target_detached = pred_target.detach()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1DetachPred
      function: node:pred_target_p1.detach
      args: []
      inputs: []
      outputs: [pred_target_p1_detached]

    # disc_fake = model["discriminator"](pred_target_detached)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1Discriminator
      function: node:model.discriminator
      args: ["node:pred_target_p1_detached"]
      inputs: []
      outputs: [discriminator_fake_p1]

    # fake_labels = torch.zeros_like(disc_fake)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1FakeLabels
      function: torch.zeros_like
      args: ["node:discriminator_fake_p1"]
      inputs: []
      outputs: [fake_labels]

    # disc_fake_loss = call_loss_with_epoch(loss_fn["adversarial"], disc_fake, fake_labels, epoch)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1AdversarialLoss
      function: loss.utils.call_loss_with_epoch
      args:
        - "node:loss_fn.adversarial"
        - "node:discriminator_fake_p1"
        - "node:fake_labels"
        - "node:epoch"
      inputs: []
      outputs: [disc_fake_loss]

    # optim["discriminator"].zero_grad()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1DiscZeroGrad
      function: node:optim.discriminator.zero_grad
      args: []
      inputs: []
      outputs: []

    # disc_fake_loss.backward()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1DiscBackward
      function: node:disc_fake_loss.backward
      args: []
      inputs: []
      outputs: []

    # optim["discriminator"].step()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase1DiscStep
      function: node:optim.discriminator.step
      args: []
      inputs: []
      outputs: []

    # ==========================================
    # Phase 2: Discriminator on real data
    # ==========================================

    # disc_real = model["discriminator"](batch["target"])
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2Discriminator
      function: node:model.discriminator
      args: ["node:batch.target"]
      inputs: []
      outputs: [discriminator_real]

    # real_labels = torch.ones_like(disc_real)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2RealLabels
      function: torch.ones_like
      args: ["node:discriminator_real"]
      inputs: []
      outputs: [real_labels]

    # disc_real_loss = call_loss_with_epoch(loss_fn["adversarial"], disc_real, real_labels, epoch)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2AdversarialLoss
      function: loss.utils.call_loss_with_epoch
      args:
        - "node:loss_fn.adversarial"
        - "node:discriminator_real"
        - "node:real_labels"
        - "node:epoch"
      inputs: []
      outputs: [disc_real_loss]

    # optim["discriminator"].zero_grad()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2DiscZeroGrad
      function: node:optim.discriminator.zero_grad
      args: []
      inputs: []
      outputs: []

    # disc_real_loss.backward()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2DiscBackward
      function: node:disc_real_loss.backward
      args: []
      inputs: []
      outputs: []

    # optim["discriminator"].step()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase2DiscStep
      function: node:optim.discriminator.step
      args: []
      inputs: []
      outputs: []

    # ==========================================
    # Phase 3: Generator
    # ==========================================

    # pred_target = model["generator"](batch["input"])  (fresh forward, not detached)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3Generator
      function: node:model.generator
      args: ["node:batch.input"]
      inputs: []
      outputs: [pred_target_p3]

    # disc_on_gen = model["discriminator"](pred_target)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3Discriminator
      function: node:model.discriminator
      args: ["node:pred_target_p3"]
      inputs: []
      outputs: [discriminator_on_gen]

    # gen_target_labels = torch.ones_like(disc_on_gen)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3GenLabels
      function: torch.ones_like
      args: ["node:discriminator_on_gen"]
      inputs: []
      outputs: [gen_target_labels]

    # disc_assumed_real_loss = call_loss_with_epoch(loss_fn["adversarial"], disc_on_gen, gen_labels, epoch)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3AdversarialLoss
      function: loss.utils.call_loss_with_epoch
      args:
        - "node:loss_fn.adversarial"
        - "node:discriminator_on_gen"
        - "node:gen_target_labels"
        - "node:epoch"
      inputs: []
      outputs: [disc_assumed_real_loss]

    # feature_matching_loss = call_loss_with_epoch(loss_fn["feature_matching"], pred_target, batch["target"], epoch)
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3FeatureMatchingLoss
      function: loss.utils.call_loss_with_epoch
      args:
        - "node:loss_fn.feature_matching"
        - "node:pred_target_p3"
        - "node:batch.target"
        - "node:epoch"
      inputs: []
      outputs: [feature_matching_loss]

    # gen_loss = disc_assumed_real_loss + feature_matching_loss
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3GenLossSum
      function: torch.add
      args: ["node:disc_assumed_real_loss", "node:feature_matching_loss"]
      inputs: []
      outputs: [gen_loss]

    # optim["generator"].zero_grad()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3GenZeroGrad
      function: node:optim.generator.zero_grad
      args: []
      inputs: []
      outputs: []

    # gen_loss.backward()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3GenBackward
      function: node:gen_loss.backward
      args: []
      inputs: []
      outputs: []

    # optim["generator"].step()
    - _target_: nodes.executor.ExecuteFunction
      name: Phase3GenStep
      function: node:optim.generator.step
      args: []
      inputs: []
      outputs: []

    # ==========================================
    # Detached loss outputs consumed by the trainer
    # ==========================================

    # disc_fake_detached = disc_fake_loss.detach()
    - _target_: nodes.executor.ExecuteFunction
      name: DetachDiscFake
      function: node:disc_fake_loss.detach
      args: []
      inputs: []
      outputs: [disc_fake_loss_detached]

    # disc_real_detached = disc_real_loss.detach()
    - _target_: nodes.executor.ExecuteFunction
      name: DetachDiscReal
      function: node:disc_real_loss.detach
      args: []
      inputs: []
      outputs: [disc_real_loss_detached]

    # discriminator = disc_fake_detached + disc_real_detached
    - _target_: nodes.executor.ExecuteFunction
      name: DiscTotal
      function: torch.add
      args: ["node:disc_fake_loss_detached", "node:disc_real_loss_detached"]
      inputs: []
      outputs: [discriminator]

    # generator = gen_loss.detach()
    - _target_: nodes.executor.ExecuteFunction
      name: GenDetach
      function: node:gen_loss.detach
      args: []
      inputs: []
      outputs: [generator]
