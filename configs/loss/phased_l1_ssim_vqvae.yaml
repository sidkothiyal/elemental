# @package _global_
# Phased loss for VQ-VAE: starts with L1 (30%), transitions to L1+SSIM
# Phase 1 (0-30%): Pure L1 loss
# Phase 2 (30-80%): Gradually introduces SSIM
# Phase 3 (80-100%): Fixed weighted L1+SSIM

loss:
  _target_: loss.phased_loss.PhasedLoss
  total_epochs: ${num_epochs}
  phases:
    - loss:
        _target_: torch.nn.L1Loss
      run_until: 0.3
    - loss:
        _target_: loss.moving_weighted_loss.MovingWeightedLoss
        start_weights: [100.0, 0.0]
        end_weights: [99.0, 1.0]
        start_percentage: 0.3
        end_percentage: 0.8
        total_epochs: ${num_epochs}
        scale_losses: true
        loss_fns:
          - _target_: torch.nn.L1Loss
          - _target_: loss.ssim.SSIMLoss
            multi_scale: true
            ssim_kwargs:
              data_range: 1.0
              size_average: True
              channel: 3
      run_until: 0.8
    - loss:
        _target_: loss.weighted_loss.WeightedLoss
        weights: [99.0, 1.0]
        scale_losses: true
        loss_fns:
          - _target_: torch.nn.L1Loss
          - _target_: loss.ssim.SSIMLoss
            multi_scale: true
            ssim_kwargs:
              data_range: 1.0
              size_average: True
              channel: 3
      run_until: 1.0
