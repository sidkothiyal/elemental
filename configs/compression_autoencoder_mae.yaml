experiment_name: compression_autoencoder_mae_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.0003
num_epochs: 500
validation_interval: 50
test: false
batch_size: 2
seed: 42
dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 100
    mode: ${mode}

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  test: null

loss:
  _target_: loss.masked_mse_loss.MaskedMSELoss
  mask_weight: 0.25
  neg_mask_weight: 1.0

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

model:
  _target_: model.masked_autoencoder.MaskedAutoencoder
  dropout_percentage: 0.5
  image_size: [3, 640, 1024]
  patch_size: [16, 16]
  embed_dim: 768
  encoder_num_transformer_layers: 8
  encoder_attn_heads: 8
  decoder_num_transformer_layers: 2
  decoder_attn_heads: 8
  return_image: true
