experiment_name: compression_autoencoder_conditional_diffusion_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.0003
num_epochs: 5000
validation_interval: 500
test: false
batch_size: 2
seed: 42
dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

clip_grad_norm: 1.0
device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 500
    mode: ${mode}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 1
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.div2k_dataset.DIV2KDataset
        root_dir: data/div2k/train
        target_shape: [640, 960]
      device: "cuda"
      prediction_type: "x0"
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    persistent_workers: true
    drop_last: false
    multiprocessing_context: "spawn"
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.diffusion_dataset.DiffusionDataset
      dataset:
        _target_: dataset.div2k_dataset.DIV2KDataset
        root_dir: data/div2k/val
        target_shape: [640, 960]
      device: "cuda"
      prediction_type: "x0"
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    persistent_workers: true
    drop_last: false
    multiprocessing_context: "spawn"
  test: null

loss:
  _target_: torch.nn.L1Loss
  # _target_: loss.phased_loss.PhasedLoss
  # total_epochs: ${num_epochs}
  # phases:
  #   - loss:
  #       _target_: torch.nn.L1Loss
  #     run_until: 0.2
  #   - loss:
  #       _target_: loss.moving_weighted_loss.MovingWeightedLoss
  #       start_weights: [100.0, 0.0]
  #       end_weights: [99.0, 1.0]
  #       start_percentage: 0.2
  #       end_percentage: 0.8
  #       total_epochs: ${num_epochs}
  #       scale_losses: true
  #       loss_fns:
  #         - _target_: torch.nn.L1Loss
  #         - _target_: loss.ssim.SSIMLoss
  #           multi_scale: true
  #           ssim_kwargs:
  #             data_range: 1.0
  #             size_average: True
  #             channel: 3
  #     run_until: 0.8
  #   - loss:
  #       _target_: loss.weighted_loss.WeightedLoss
  #       weights: [99.0, 1.0]
