  #             data_range: 1.0
  #             size_average: True
  #             channel: 3
  #     run_until: 1.0

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

# lr_scheduler: "StepLR"
# lr_scheduler_params:
#   step_size: 25
#   gamma: 0.9

model_input_args:
  - "t"
  - "cond"

model:
  _target_: model.diffusion.DenoisingDiffusionModel
  use_timestep_embedding: true
  timestep_model:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Embedding
        num_embeddings: 1000
        embedding_dim: 3
  prediction_type: "x0"
  conditional_model:
    _target_: model.vq_vae.VQVAE
    encoder:
      _target_: torch.nn.Sequential
      _args_:
        - _target_: model.patcher_unpatcher.Patcher
          image_size: [3, 640, 960]
          patch_size: [16, 16]
          embed_dim: 256
        - _target_: model.transformer.Transformer
          embed_dim: 256
          num_heads: 8
          num_layers: 8
          ff_embed_dim: 256
    codebook_size: 1024
    codebook_dim: 256
  model:
    _target_: model.conditional_autoencoder.ConditionalAutoencoder
    encoder:
      _target_: model.combiner.DiffusionCombiner
      model:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: model.patcher_unpatcher.Patcher
            image_size: [3, 640, 960]
            patch_size: [16, 16]
            embed_dim: 256
          - _target_: model.transformer.Transformer
            embed_dim: 256
            num_heads: 8
            num_layers: 8
            ff_embed_dim: 256
      time_mlp: null
      aux_features_combiner: null
    decoder:
      _target_: model.combiner.DiffusionCombiner
      model:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: model.transformer.Transformer
            embed_dim: 256
            num_heads: 8
            num_layers: 8
            ff_embed_dim: 256
          - _target_: model.patcher_unpatcher.Unpatcher
            image_size: [64, 640, 960]
            patch_size: [16, 16]
            embed_dim: 256
            decoder_projection_dim: 64
            model_downsample_factor: 1
            conv_decoder:
              _target_: torch.nn.Sequential
              _args_:
                - _target_: model.blocks.resnet_block.ResNetStage
                  block_type:
                    _target_: hydra.utils.get_class
                    _args_:
                      - model.blocks.resnet_block.BasicResNetBlock
                  in_channels: 64
                  out_channels: 32
                  num_blocks: 2
                  stride: 1
                  groups: 1
                  dilation: 1
                - _target_: model.blocks.resnet_block.ResNetStage
                  block_type:
                    _target_: hydra.utils.get_class
                    _args_:
                      - model.blocks.resnet_block.BasicResNetBlock
                  in_channels: 32
                  out_channels: 16
                  num_blocks: 2
                  stride: 1
                  groups: 1
                  dilation: 1
                - _target_: torch.nn.Conv2d
                  in_channels: 16
                  out_channels: 3
                  kernel_size: 3
                  stride: 1
                  padding: 1
      time_mlp:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: torch.nn.SiLU
          - _target_: torch.nn.Linear
            in_features: 3
            out_features: 4800
      aux_features_combiner:
        _target_: model.combiner.Combiner
        combiner:
          _target_: model.combiner.CrossAttentionCombiner
          embed_dim: 256
          num_heads: 8
        x_model: null
        y_model: null
        model: null
