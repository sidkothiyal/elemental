experiment_name: gan_seg_cityscapes_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/gan/

mode: "gan"

lr: 0.0001
num_epochs: 100
test: false
batch_size: 8
seed: 42

device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 50
    num_classes: 31
    mode: ${mode}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 10
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/train
      segmentation_enabled: true
      depth_enabled: false
      rename_output_keys:
        seg_mask: target
    batch_size: ${batch_size}
    shuffle: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/val
      segmentation_enabled: true
      depth_enabled: false
      rename_output_keys:
        seg_mask: target
    batch_size: ${batch_size}
    shuffle: false
  test: null

loss:
  feature_matching:
    _target_: torch.nn.CrossEntropyLoss
  adversarial:
    _target_: torch.nn.BCEWithLogitsLoss

lr_scheduler_params:
  step_size: 10
  gamma: 0.75

model:
  _target_: torch.nn.ModuleDict
  modules:
    generator:
      _target_: model.unet.UNet
      in_channels: 3
      out_channels: 31

    discriminator:
      _target_: model.blocks.ConvBlock
      in_channels: 31
      channels: [64, 128, 256, 512, 1]
      kernel_sizes: [4, 4, 4, 4, 4]
      strides: [2, 2, 2, 1, 1]
      paddings: [1, 1, 1, 1, 1]
