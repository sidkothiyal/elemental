# @package _global_
# Export config for the VQ-VAE Transformer model (PatcherUnpatcher + VQVAE).
#
# Model architecture: model/vq_vae_transformer.yaml
#   PatcherUnpatcher
#   ├── patcher        (conv_encoder → patch embedding)
#   ├── model          (VQVAE: Transformer encoder → quantizer → Transformer decoder)
#   └── unpatcher      (patch unembedding → conv_decoder)
#
# Two extraction methods are demonstrated:
#   PyTorch-level  — input_layer/output_layer (module paths, resolved before ONNX export)
#   ONNX-level     — source_onnx + input_tensor/output_tensor (onnx.utils.extract_model)
#
# Workflow:
#   1. Export full_model, patcher, unpatcher (PyTorch-level, can run independently).
#   2. Uncomment the ONNX-level entries after running:
#        python -c "import onnx; m=onnx.load('exports/vqvae_full.onnx'); \
#                   [print(n.name) for n in m.graph.node]"
#      to discover the exact intermediate tensor names.
#
# Usage:
#   uv run python src/exporter.py export/vq_vae_transformer \
#       --checkpoint checkpoints/vqvae.pt \
#       --output-dir exports/vqvae/

defaults:
  - /export/default           # base export settings (device, opset, etc.)
  - /model: vq_vae_transformer  # PatcherUnpatcher model architecture
  - _self_

# Optional: set to a checkpoint path or override via --checkpoint flag.
load_checkpoint_path: null

export:
  opset_version: 21
  dynamic_axes: true

  modules:
    # ------------------------------------------------------------------
    # PyTorch-level exports (input_layer = dotted submodule path)
    # ------------------------------------------------------------------

    # Full model — input_layer: null means the whole PatcherUnpatcher is exported.
    - name: "full_model"
      input_layer: null
      output_layer: null
      onnx_filename: "vqvae_full.onnx"
      inputs:
        - name: "input_image"
          shape: [1, 3, 640, 960]
          dtype: "float32"
      outputs:
        - name: "reconstructed_image"

    # Patcher only (conv_encoder + patch embedding).
    # Resolves to PatcherUnpatcher.patcher submodule.
    - name: "patcher"
      input_layer: "patcher"
      output_layer: "patcher"
      onnx_filename: "vqvae_patcher.onnx"
      inputs:
        - name: "input_image"
          shape: [1, 3, 640, 960]
          dtype: "float32"
      outputs:
        - name: "patch_embeddings"

    # Unpatcher only (patch unembedding + conv_decoder).
    # Resolves to PatcherUnpatcher.unpatcher submodule.
    - name: "unpatcher"
      input_layer: "unpatcher"
      output_layer: "unpatcher"
      onnx_filename: "vqvae_unpatcher.onnx"
      inputs:
        - name: "decoded_features"
          shape: [1, 2400, 256]
          dtype: "float32"
      outputs:
        - name: "reconstructed_image"

    # ------------------------------------------------------------------
    # ONNX-level extraction via onnx.utils.extract_model
    # Uncomment after exporting full_model above and inspecting tensor names.
    #
    # To discover tensor names:
    #   python -c "
    #   import onnx
    #   m = onnx.load('exports/vqvae/vqvae_full.onnx')
    #   for n in m.graph.node: print(n.name, [o for o in n.output])
    #   "
    # Or use Netron (https://netron.app) to inspect the graph visually.
    # ------------------------------------------------------------------

    # Encoder sub-model: input image → quantized latents.
    # Replace output_tensor with the actual quantizer output tensor name.
    #
    # - name: "encoder_onnx"
    #   source_onnx: "vqvae_full.onnx"   # must already exist in output_dir
    #   input_tensor: "input_image"
    #   output_tensor: "/model/quantizer/Gemm_output_0"  # from inspect above
    #   onnx_filename: "vqvae_encoder_extracted.onnx"

    # Decoder sub-model: quantized latents → reconstructed image.
    #
    # - name: "decoder_onnx"
    #   source_onnx: "vqvae_full.onnx"
    #   input_tensor: "/model/quantizer/Gemm_output_0"
    #   output_tensor: "reconstructed_image"
    #   onnx_filename: "vqvae_decoder_extracted.onnx"
