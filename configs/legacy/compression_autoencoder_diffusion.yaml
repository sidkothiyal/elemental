  #             size_average: True
  #             channel: 3
  #     run_until: 1.0

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

# lr_scheduler: "StepLR"
# lr_scheduler_params:
#   step_size: 25
#   gamma: 0.9

model_input_args:
  - "t"

model:
  _target_: model.diffusion.DenoisingDiffusionModel
  use_timestep_embedding: true
  timestep_model:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Embedding
        num_embeddings: 1000
        embedding_dim: 3
      - _target_: model.nn_modules.Unsqueeze
        axis: -1
      - _target_: model.nn_modules.Unsqueeze
        axis: -1
  prediction_type: "x0"
  model:
    _target_: model.combiner.DiffusionCombiner
    timestep_combiner:
      _target_: model.nn_modules.Add
    model:
      _target_: model.unet.UNet
      in_channels: 3
      out_channels: 3
      channels: [4, 8, 16, 32, 64]
      skip_first_connection: true

