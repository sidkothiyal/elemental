# @package _global_
experiment_name: compression_autoencoder_gan_unet_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/gan/

mode: "gan"

lr: 0.0005
num_epochs: 500
validation_interval: 25
test: false
batch_size: 32
seed: 42
dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

clip_grad_norm: 1.0
device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    logging_interval: 50
    mode: ${mode}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 10
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  test: null

loss:
  feature_matching:
    _target_: loss.phased_loss.PhasedLoss
    total_epochs: ${num_epochs}
    phases:
      - loss:
          _target_: torch.nn.L1Loss
        run_until: 0.5
      - loss:
          _target_: loss.moving_weighted_loss.MovingWeightedLoss
          start_weights: [100.0, 0.0]
          end_weights: [99.0, 1.0]
          start_percentage: 0.5
          end_percentage: 1.0
          total_epochs: ${num_epochs}
          scale_losses: true
          loss_fns:
            - _target_: torch.nn.L1Loss
            - _target_: loss.ssim.SSIMLoss
              multi_scale: true
              ssim_kwargs:
                data_range: 1.0
                size_average: True
                channel: 3
        run_until: 1.0
  adversarial:
    _target_: torch.nn.BCEWithLogitsLoss

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

model:
  _target_: torch.nn.ModuleDict
  modules:
    generator:
      _target_: model.unet.UNet
      in_channels: 3
      out_channels: 3
      channels: [4, 8, 16, 32, 64]
      skip_first_connection: true

    discriminator:
      _target_: model.blocks.ConvBlock
      in_channels: 3
      channels: [64, 128, 256, 512, 1]
      kernel_sizes: [4, 4, 4, 4, 4]
      strides: [2, 2, 2, 1, 1]
      paddings: [1, 1, 1, 1, 1]
