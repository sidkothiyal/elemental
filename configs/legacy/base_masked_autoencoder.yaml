# @package _global_
experiment_name: masked_autoencoder_cityscapes_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/masked_autoencoder/

mode: "autoencoder"

lr: 0.0005
num_epochs: 1000
test: false
batch_size: 64
seed: 42

device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 50
    mode: ${mode}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 50
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/train
      segmentation_enabled: false
      depth_enabled: false
      rename_output_keys:
        input: target
    batch_size: ${batch_size}
    shuffle: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.cityscapes_dataset.CityscapesDataset
      root_dir: data/cityscapes/val
      segmentation_enabled: false
      depth_enabled: false
      rename_output_keys:
        input: target
    batch_size: ${batch_size}
    shuffle: false
  test: null

loss:
  _target_: loss.masked_mse_loss.MaskedMSELoss
  mask_weight: 0.25
  neg_mask_weight: 1.0

lr_scheduler_params:
  step_size: 20
  gamma: 0.90

model:
  _target_: model.masked_autoencoder.MaskedAutoencoder
  dropout_percentage: 0.5
  image_size: [3, 128, 256]
  patch_size: [16, 16]
  embed_dim: 768
  encoder_num_transformer_layers: 8
  encoder_attn_heads: 8
  decoder_num_transformer_layers: 2
  decoder_attn_heads: 8
  return_image: true
