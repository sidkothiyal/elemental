# @package _global_
experiment_name: compression_autoencoder_mae_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoencoder/

mode: "autoencoder"

lr: 0.000075
num_epochs: 1000
validation_interval: 50
test: false
batch_size: 16
seed: 42

load_checkpoint_path: results/autoencoder/compression_autoencoder_mae_enc_nl8_nh8_dec_nl6_nh8_dropout_0/last.pt
load_keys: ["model"]

dtype:
  _target_: hydra.utils.get_object
  _args_:
    - torch.bfloat16

device: "gpu"

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    num_samples_to_log: 1
    logging_interval: 100
    mode: ${mode}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 25
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/train
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.div2k_dataset.DIV2KDataset
      root_dir: data/div2k/val
      target_shape: [640, 1024]
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: false
  test: null

loss:
  _target_: loss.masked_loss.MaskedLoss
  loss_function:
    _target_: torch.nn.MSELoss
    reduction: "none"
  auto_scale_loss: true
  mask_weight: 0.1
  neg_mask_weight: 1.0

optimizer: "AdamW"

lr_scheduler: "CosineAnnealingLR"
lr_scheduler_params:
  T_max: ${num_epochs}

model:
  _target_: model.masked_autoencoder.MaskedAutoencoder
  dropout_percentage: 0.2
  image_size: [3, 640, 1024]
  patch_size: [32, 32]
  embed_dim: 768
  encoder:
    _target_: model.transformer.Transformer
    embed_dim: 768
    num_heads: 8
    num_layers: 8
    ff_embed_dim: 768
  decoder:
    _target_: model.transformer.Transformer
    embed_dim: 768
    num_heads: 8
    num_layers: 6
    ff_embed_dim: 768
  decoder_projection_dim: 96
  conv_decoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: model.blocks.conv_block.ConvBlock
        in_channels: 96
        channels: [48, 16]
        kernel_sizes: [3, 3]
        strides: [1, 1]
        paddings: [1, 1]
        use_bn: true
        use_relu: true
      - _target_: torch.nn.Conv2d
        in_channels: 16
        out_channels: 3
        kernel_size: 3
        stride: 1
        padding: 1
  return_image: true
