# @package _global_
experiment_name: autoregressive_lm_wikitext_${now:%Y-%m-%d}_${now:%H-%M-%S}
results_dir: results/autoregressive_lm/

mode: "autoregressive"

lr: 0.00025
num_epochs: 10000
test: false
batch_size: 6
gradient_accumulation_steps: 2
seed: 42
validation_interval: 1000

device: "gpu"

max_length: 1024
pretrained_tokenizer: "gpt2"
embedding_dim: 768
ff_embed_dim: 1536

num_heads: 6
num_layers: 6

callbacks:
  - _target_: callback.wandb_callback.WandbCallback
    exp_name: ${experiment_name}
    project: "elemental"
    entity: "elemental-ai"
    logging_interval: 100
    mode: ${mode}
    log_text_data: true
    tokenizer: ${pretrained_tokenizer}
  - _target_: callback.checkpoint_callback.CheckpointCallback
    save_dir: ${results_dir}/${experiment_name}
    save_every_n_epochs: 100
    save_every_n_steps: null
    save_best: true
    save_last: true
    monitor_metric: "total"
    mode: "min"
    max_checkpoints_saved: 5

dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.wikitext_dataset.WikiTextDataset
      dataset_dir: data/wikitext/paragraphs
      split: train
      max_length: ${max_length}
      pretrained_tokenizer: ${pretrained_tokenizer}
      num_samples: 10
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  val:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: dataset.wikitext_dataset.WikiTextDataset
      dataset_dir: data/wikitext/paragraphs
      split: val
      max_length: ${max_length}
      pretrained_tokenizer: ${pretrained_tokenizer}
      num_samples: 10
    batch_size: ${batch_size}
    shuffle: false
    num_workers: 10
    pin_memory: true
    persistent_workers: true
  test: null

loss:
  _target_: loss.shifted_teacher_forcing.ShiftedTeacherForcing
  shift: 1
  loss_fn:
    _target_: torch.nn.CrossEntropyLoss
    # ignore_index: 50256

lr_scheduler_params:
  step_size: 500
  gamma: 0.9

model:
  _target_: model.autoregressive_lm.AutoregressiveLM
  encoder:
    _target_: model.transformer.Transformer
    embed_dim: ${embedding_dim}
    num_heads: ${num_heads}
    num_layers: ${num_layers}
    ff_embed_dim: ${ff_embed_dim}
  token_embedding: null
  positional_embedding: null
  embedding_dim: ${embedding_dim}
  max_length: ${max_length}
  pretrained_tokenizer: ${pretrained_tokenizer}
